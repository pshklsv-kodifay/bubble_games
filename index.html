```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ночь — пузыри</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02050a;
    cursor: none;
    font-family: Arial, sans-serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #ui {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    pointer-events: none;
    text-align: center;
    color: rgba(255, 255, 255, 0.9);
    text-shadow:
      0 0 8px rgba(255, 255, 255, 0.35),
      0 0 20px rgba(120, 180, 255, 0.25);
  }

  #score {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    transition: transform 0.15s ease;
  }

  #combo {
    margin-top: 7px;
    min-height: 22px;
    font-size: 15px;
    letter-spacing: 4px;
    color: rgba(255, 220, 150, 0.9);
    opacity: 0;
    transform: translateY(-4px);
    transition:
      opacity 0.2s ease,
      transform 0.2s ease;
  }

  #combo.active {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <div id="score">0</div>
  <div id="combo">КОМБО ×3</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");

let W = 0;
let H = 0;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

const mouse = {
  x: 0,
  y: 0,
  active: false
};

const bubbles = [];
const redBubbles = [];
const flashes = [];
const trail = [];

let score = 0;
let caught = 0;
let combo = 0;

let comboTimer = 0;
let rainbowMode = false;
let rainbowTimer = 0;

let redBubbleTimer = 5500 + Math.random() * 5000;

let lastTime = performance.now();


// --------------------------------------------------
// RESIZE
// --------------------------------------------------

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;

  DPR = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resize);
resize();


// --------------------------------------------------
// MOUSE
// --------------------------------------------------

window.addEventListener("mousemove", (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;

  trail.push({
    x: mouse.x,
    y: mouse.y,
    life: 1
  });

  if (trail.length > 35) {
    trail.shift();
  }
});

window.addEventListener("mouseleave", () => {
  mouse.active = false;
});


// --------------------------------------------------
// GAME SPEED
// --------------------------------------------------

function gameSpeed() {
  return 1 + Math.min(caught / 50, 1.5);
}


// --------------------------------------------------
// NORMAL BUBBLES
// --------------------------------------------------

function createBubble() {
  return {
    x: Math.random() * W,
    y: H + 30 + Math.random() * 80,

    r: 6 + Math.random() * 19,

    speed: 0.18 + Math.random() * 0.30,
    drift: 0.15 + Math.random() * 0.40,

    phase: Math.random() * Math.PI * 2,

    hue: Math.random() * 360,

    alpha: 0.45 + Math.random() * 0.4,

    age: 0,
    lifetime: 3000,

    dead: false
  };
}

function fillInitialBubbles() {
  bubbles.length = 0;

  const amount = Math.max(
    18,
    Math.min(32, Math.floor(W / 40))
  );

  for (let i = 0; i < amount; i++) {
    const b = createBubble();

    b.y = Math.random() * H;
    b.age = Math.random() * 2200;

    bubbles.push(b);
  }
}

fillInitialBubbles();


// --------------------------------------------------
// CATCH NORMAL BUBBLE
// --------------------------------------------------

function catchBubble(bubble) {
  if (bubble.dead) return;

  bubble.dead = true;

  score++;
  caught++;
  combo++;

  comboTimer = 1400;

  flashes.push({
    x: bubble.x,
    y: bubble.y,
    life: 0,
    duration: 450,
    radius: bubble.r * 2.5,
    color: `hsla(${bubble.hue}, 100%, 75%, 0.9)`,
    fullScreen: false
  });

  if (combo >= 3) {
    combo = 0;

    rainbowMode = true;
    rainbowTimer = 5000;

    comboEl.classList.add("active");

    flashes.push({
      x: W / 2,
      y: H / 2,
      life: 0,
      duration: 900,
      radius: Math.max(W, H),
      color: "rgba(255, 255, 255, 0.9)",
      fullScreen: true
    });
  }

  scoreEl.textContent = score;

  scoreEl.style.transform = "scale(1.25)";

  setTimeout(() => {
    scoreEl.style.transform = "scale(1)";
  }, 120);

  // Небольшой дополнительный всплеск
  for (let i = 0; i < 7; i++) {
    const angle = Math.random() * Math.PI * 2;

    trail.push({
      x: bubble.x + Math.cos(angle) * bubble.r,
      y: bubble.y + Math.sin(angle) * bubble.r,
      life: 1
    });
  }
}


// --------------------------------------------------
// CHECK NORMAL BUBBLE
// --------------------------------------------------

function checkBubble(bubble) {
  if (!mouse.active || bubble.dead) return;

  const dx = mouse.x - bubble.x;
  const dy = mouse.y - bubble.y;

  const distance = Math.hypot(dx, dy);

  if (distance < bubble.r + 8) {
    catchBubble(bubble);
  }
}


// --------------------------------------------------
// UPDATE NORMAL BUBBLES
// --------------------------------------------------

function updateBubbles(dt) {
  const speedMultiplier = gameSpeed();

  for (const b of bubbles) {
    if (b.dead) continue;

    b.age += dt;

    // Каждый пузырь живёт ровно около 3 секунд
    if (b.age >= b.lifetime) {
      b.dead = true;

      // Пропуск пузыря ломает серию
      combo = 0;
      comboTimer = 0;

      continue;
    }

    // Движение вверх
    b.y -= b.speed * speedMultiplier * dt;

    // Плавное движение по горизонтали
    b.x +=
      Math.sin(
        b.phase + b.age * 0.0015
      ) *
      b.drift *
      dt;

    // Проверка столкновения с курсором
    checkBubble(b);

    // Если ушёл за верх экрана
    if (b.y < -50) {
      b.dead = true;

      combo = 0;
      comboTimer = 0;
    }
  }

  // Удаляем погибшие
  for (let i = bubbles.length - 1; i >= 0; i--) {
    if (bubbles[i].dead) {
      bubbles.splice(i, 1);

      // Поддерживаем количество пузырей
      bubbles.push(createBubble());
    }
  }
}


// --------------------------------------------------
// DRAW NORMAL BUBBLE
// --------------------------------------------------

function drawBubble(b) {
  let hue = b.hue;

  if (rainbowMode) {
    hue =
      (b.hue +
        performance.now() * 0.08) %
      360;
  }

  // Внешнее свечение
  const glow = ctx.createRadialGradient(
    b.x,
    b.y,
    0,
    b.x,
    b.y,
    b.r * 3.5
  );

  glow.addColorStop(
    0,
    `hsla(${hue}, 100%, 75%, 0.30)`
  );

  glow.addColorStop(
    0.35,
    `hsla(${hue}, 100%, 65%, 0.13)`
  );

  glow.addColorStop(
    1,
    `hsla(${hue}, 100%, 50%, 0)`
  );

  ctx.fillStyle = glow;

  ctx.beginPath();
  ctx.arc(
    b.x,
    b.y,
    b.r * 3.5,
    0,
    Math.PI * 2
  );
  ctx.fill();


  // Прозрачное тело
  const body = ctx.createRadialGradient(
    b.x - b.r * 0.35,
    b.y - b.r * 0.4,
    1,
    b.x,
    b.y,
    b.r
  );

  body.addColorStop(
    0,
    `hsla(${hue}, 100%, 95%, 0.40)`
  );

  body.addColorStop(
    0.3,
    `hsla(${hue}, 100%, 80%, 0.16)`
  );

  body.addColorStop(
    0.75,
    `hsla(${hue}, 100%, 60%, 0.07)`
  );

  body.addColorStop(
    1,
    `hsla(${hue}, 100%, 40%, 0.01)`
  );

  ctx.fillStyle = body;

  ctx.beginPath();
  ctx.arc(
    b.x,
    b.y,
    b.r,
    0,
    Math.PI * 2
  );
  ctx.fill();


  // Контур
  ctx.strokeStyle =
    `hsla(${hue}, 100%, 80%, ${b.alpha})`;

  ctx.lineWidth = 1.2;

  ctx.beginPath();
  ctx.arc(
    b.x,
    b.y,
    b.r,
    0,
    Math.PI * 2
  );
  ctx.stroke();


  // Блик
  ctx.fillStyle =
    "rgba(255, 255, 255, 0.75)";

  ctx.beginPath();

  ctx.arc(
    b.x - b.r * 0.32,
    b.y - b.r * 0.35,
    Math.max(1.2, b.r * 0.14),
    0,
    Math.PI * 2
  );

  ctx.fill();


  // Маленький внутренний блик
  ctx.strokeStyle =
    "rgba(255,255,255,0.3)";

  ctx.lineWidth = 0.8;

  ctx.beginPath();

  ctx.arc(
    b.x - b.r * 0.1,
    b.y - b.r * 0.05,
    b.r * 0.65,
    Math.PI * 1.1,
    Math.PI * 1.7
  );

  ctx.stroke();
}


// --------------------------------------------------
// RED BUBBLE
// --------------------------------------------------

function createRedBubble() {
  return {
    x: Math.random() * W,

    // Появляется снизу
    y: H + 40,

    r: 11 + Math.random() * 10,

    // Немного быстрее обычных
    speed: 0.27 + Math.random() * 0.25,

    drift: 0.18 + Math.random() * 0.35,

    phase: Math.random() * Math.PI * 2,

    age: 0,

    // Тоже живёт около 3 секунд
    lifetime: 3000,

    dead: false
  };
}


// --------------------------------------------------
// CHECK RED BUBBLE
// --------------------------------------------------

function checkRedBubble(bubble) {
  if (!mouse.active || bubble.dead) return;

  const dx = mouse.x - bubble.x;
  const dy = mouse.y - bubble.y;

  const distance = Math.hypot(dx, dy);

  if (distance < bubble.r + 10) {

    // Сбрасываем всё
    score = 0;
    caught = 0;
    combo = 0;
    comboTimer = 0;

    rainbowMode = false;
    rainbowTimer = 0;

    scoreEl.textContent = "0";

    comboEl.classList.remove("active");

    // Красная вспышка
    flashes.push({
      x: bubble.x,
      y: bubble.y,
      life: 0,
      duration: 800,
      radius: Math.max(W, H) * 1.5,
      color: "rgba(255, 20, 20, 0.95)",
      fullScreen: true
    });

    bubble.dead = true;
  }
}


// --------------------------------------------------
// UPDATE RED BUBBLE
// --------------------------------------------------

function updateRedBubbles(dt) {
  const speedMultiplier = gameSpeed();

  for (const b of redBubbles) {
    if (b.dead) continue;

    b.age += dt;

    // Движется вверх
    b.y -=
      b.speed *
      speedMultiplier *
      dt;

    // Плавное движение в стороны
    b.x +=
      Math.sin(
        b.phase + b.age * 0.0015
      ) *
      b.drift *
      dt;

    // Столкновение
    checkRedBubble(b);

    // Таймер жизни
    if (b.age >= b.lifetime) {
      b.dead = true;

      combo = 0;
      comboTimer = 0;
    }

    // Ушёл за экран
    if (b.y < -50) {
      b.dead = true;

      combo = 0;
      comboTimer = 0;
    }
  }

  for (let i = redBubbles.length - 1; i >= 0; i--) {
    if (redBubbles[i].dead) {
      redBubbles.splice(i, 1);
    }
  }
}


// --------------------------------------------------
// DRAW RED BUBBLE
// --------------------------------------------------

function drawRedBubble(b) {

  // Сильное красное свечение
  const glow = ctx.createRadialGradient(
    b.x,
    b.y,
    0,
    b.x,
    b.y,
    b.r * 4
  );

  glow.addColorStop(
    0,
    "rgba(255, 30, 30, 0.55)"
  );

  glow.addColorStop(
    0.3,
    "rgba(255, 20, 20, 0.22)"
  );

  glow.addColorStop(
    0.65,
    "rgba(200, 0, 0, 0.08)"
  );

  glow.addColorStop(
    1,
    "rgba(255, 0, 0, 0)"
  );

  ctx.fillStyle = glow;

  ctx.beginPath();
  ctx.arc(
    b.x,
    b.y,
    b.r * 4,
    0,
    Math.PI * 2
  );
  ctx.fill();


  // Тело
  const body = ctx.createRadialGradient(
    b.x - b.r * 0.35,
    b.y - b.r * 0.4,
    1,
    b.x,
    b.y,
    b.r
  );

  body.addColorStop(
    0,
    "rgba(255, 180, 180, 0.60)"
  );

  body.addColorStop(
    0.25,
    "rgba(255, 60, 60, 0.30)"
  );

  body.addColorStop(
    0.65,
    "rgba(220, 0, 0, 0.13)"
  );

  body.addColorStop(
    1,
    "rgba(130, 0, 0, 0.03)"
  );

  ctx.fillStyle = body;

  ctx.beginPath();
  ctx.arc(
    b.x,
    b.y,
    b.r,
    0,
    Math.PI * 2
  );
  ctx.fill();


  // Красный контур
  ctx.strokeStyle =
    "rgba(255, 70, 70, 0.95)";

  ctx.lineWidth = 1.8;

  ctx.beginPath();
  ctx.arc(
    b.x,
    b.y,
    b.r,
    0,
    Math.PI * 2
  );
  ctx.stroke();


  // Белый блик
  ctx.fillStyle =
    "rgba(255, 255, 255, 0.85)";

  ctx.beginPath();

  ctx.arc(
    b.x - b.r * 0.34,
    b.y - b.r * 0.37,
    Math.max(1.5, b.r * 0.15),
    0,
    Math.PI * 2
  );

  ctx.fill();


  // Красное ядро
  const pulse =
    1 +
    Math.sin(performance.now() * 0.006) *
    0.08;

  ctx.strokeStyle =
    "rgba(255, 30, 30, 0.35)";

  ctx.lineWidth = 1;

  ctx.beginPath();

  ctx.arc(
    b.x,
    b.y,
    b.r * 0.72 * pulse,
    0,
    Math.PI * 2
  );

  ctx.stroke();
}


// --------------------------------------------------
// RED BUBBLE SPAWN TIMER
// --------------------------------------------------

function spawnRedBubble(dt) {
  redBubbleTimer -= dt;

  if (
    redBubbleTimer <= 0 &&
    redBubbles.length === 0
  ) {
    redBubbles.push(
      createRedBubble()
    );

    // Следующий красный пузырь
    redBubbleTimer =
      7000 +
      Math.random() * 7000;
  }
}


// --------------------------------------------------
// COMBO TIMER
// --------------------------------------------------

function updateCombo(dt) {
  if (comboTimer > 0) {
    comboTimer -= dt;

    if (comboTimer <= 0) {
      comboTimer = 0;
      combo = 0;
    }
  }

  if (rainbowMode) {
    rainbowTimer -= dt;

    if (rainbowTimer <= 0) {
      rainbowTimer = 0;
      rainbowMode = false;
      comboEl.classList.remove("active");
    }
  }
}


// --------------------------------------------------
// TRAIL
// --------------------------------------------------

function updateTrail(dt) {
  for (const p of trail) {
    p.life -= dt / 420;
  }

  for (let i = trail.length - 1; i >= 0; i--) {
    if (trail[i].life <= 0) {
      trail.splice(i, 1);
    }
  }
}

function drawTrail() {
  for (const p of trail) {
    if (p.life <= 0) continue;

    const radius =
      2.5 * p.life;

    const glow = ctx.createRadialGradient(
      p.x,
      p.y,
      0,
      p.x,
      p.y,
      radius * 4
    );

    glow.addColorStop(
      0,
      `rgba(255, 190, 90, ${p.life * 0.7})`
    );

    glow.addColorStop(
      1,
      "rgba(255, 130, 40, 0)"
    );

    ctx.fillStyle = glow;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius * 4,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      `rgba(255, 210, 120, ${p.life * 0.7})`;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }
}


// --------------------------------------------------
// FLASHES
// --------------------------------------------------

function updateFlashes(dt) {
  for (const f of flashes) {
    f.life += dt;
  }

  for (let i = flashes.length - 1; i >= 0; i--) {
    if (
      flashes[i].life >=
      flashes[i].duration
    ) {
      flashes.splice(i, 1);
    }
  }
}

function drawFlashes() {
  for (const f of flashes) {
    const progress =
      f.life / f.duration;

    const alpha =
      Math.max(0, 1 - progress);

    if (f.fullScreen) {

      ctx.save();

      ctx.globalCompositeOperation =
        "screen";

      ctx.fillStyle =
        f.color.replace(
          /[\d.]+\)$/g,
          `${alpha * 0.5})`
        );

      ctx.fillRect(
        0,
        0,
        W,
        H
      );

      ctx.restore();

    } else {

      const radius =
        f.radius *
        (0.4 + progress * 1.8);

      const glow =
        ctx.createRadialGradient(
          f.x,
          f.y,
          0,
          f.x,
          f.y,
          radius
        );

      glow.addColorStop(
        0,
        `rgba(255,255,255,${alpha})`
      );

      glow.addColorStop(
        0.25,
        f.color.replace(
          /[\d.]+\)$/g,
          `${alpha * 0.7})`
        )
      );

      glow.addColorStop(
        1,
        "rgba(255,255,255,0)"
      );

      ctx.fillStyle = glow;

      ctx.beginPath();

      ctx.arc(
        f.x,
        f.y,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }
  }
}


// --------------------------------------------------
// CURSOR LIGHT
// --------------------------------------------------

function drawCursorLight() {
  if (!mouse.active) return;

  const radius = 95;

  const light =
    ctx.createRadialGradient(
      mouse.x,
      mouse.y,
      0,
      mouse.x,
      mouse.y,
      radius
    );

  light.addColorStop(
    0,
    "rgba(255, 210, 130, 0.20)"
  );

  light.addColorStop(
    0.25,
    "rgba(255, 170, 80, 0.09)"
  );

  light.addColorStop(
    0.55,
    "rgba(255, 130, 50, 0.035)"
  );

  light.addColorStop(
    1,
    "rgba(255, 100, 20, 0)"
  );

  ctx.fillStyle = light;

  ctx.beginPath();

  ctx.arc(
    mouse.x,
    mouse.y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();


  // Центральная точка курсора
  ctx.fillStyle =
    "rgba(255, 220, 160, 0.95)";

  ctx.shadowBlur = 14;
  ctx.shadowColor =
    "rgba(255, 170, 80, 0.9)";

  ctx.beginPath();

  ctx.arc(
    mouse.x,
    mouse.y,
    2.2,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;
}


// --------------------------------------------------
// BACKGROUND
// --------------------------------------------------

function drawBackground() {

  // Очень тёмная вода
  const bg =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  bg.addColorStop(
    0,
    "#01040a"
  );

  bg.addColorStop(
    0.5,
    "#020913"
  );

  bg.addColorStop(
    1,
    "#010305"
  );

  ctx.fillStyle = bg;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  // Едва заметные водяные полосы
  const time =
    performance.now() * 0.00025;

  ctx.save();

  ctx.globalAlpha = 0.055;

  ctx.strokeStyle =
    "rgba(100, 160, 200, 0.5)";

  ctx.lineWidth = 1;

  for (
    let y = 80;
    y < H;
    y += 90
  ) {

    ctx.beginPath();

    for (
      let x = -50;
      x <= W + 50;
      x += 30
    ) {

      const yy =
        y +
        Math.sin(
          x * 0.008 +
          time +
          y * 0.02
        ) *
        5;

      if (x === -50) {
        ctx.moveTo(x, yy);
      } else {
        ctx.lineTo(x, yy);
      }
    }

    ctx.stroke();
  }

  ctx.restore();
}


// --------------------------------------------------
// MAIN LOOP
// --------------------------------------------------

function animate(now) {
  const dt =
    Math.min(
      now - lastTime,
      40
    );

  lastTime = now;


  // Фон
  drawBackground();


  // Обновление
  updateBubbles(dt);

  spawnRedBubble(dt);
  updateRedBubbles(dt);

  updateCombo(dt);
  updateTrail(dt);
  updateFlashes(dt);


  // Обычные пузыри
  for (const b of bubbles) {
    drawBubble(b);
  }


  // Красный пузырь
  for (const b of redBubbles) {
    drawRedBubble(b);
  }


  // След курсора
  drawTrail();


  // Вспышки
  drawFlashes();


  // Свет вокруг курсора
  drawCursorLight();


  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
